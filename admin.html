<title>لوحة تحكم AM TECH</title>

<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#0f172a;color:#fff;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:16px;max-width:500px;margin:auto}
h2{text-align:center;margin-bottom:15px}
input,select{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:none}
button{width:100%;padding:12px;background:#0a7bff;color:#fff;border:none;border-radius:12px;font-weight:800;margin-top:10px;cursor:pointer}
.prod{background:#0f172a;padding:10px;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.prod img{width:45px;height:45px;border-radius:8px;object-fit:cover}
.linkBox{background:#0a7bff22;border:1px dashed #0a7bff;padding:12px;border-radius:10px;margin-bottom:15px;text-align:center;font-size:13px}
</style>

<body>
<div class="card" id="loginBox">
<h2>🔒 دخول الأدمن</h2>
<input id="pass" type="password" placeholder="الباسورد">
<button onclick="login()">دخول</button>
<p style="text-align:center;margin-top:10px;font-size:12px;opacity:.6">الباسورد الافتراضي: ahmed123</p>
</div>

<div class="card" id="adminBox" style="display:none">
<h2>🛠️ لوحة تحكم AM TECH</h2>
<div class="linkBox">
لينك المتجر للزباين:<br>
<b id="storeLink" style="color:#0a7bff;word-break:break-all"></b><br>
<button onclick="copyStore()" style="width:auto;padding:5px 15px;margin-top:5px;font-size:12px">نسخ اللينك</button>
</div>

<h3 style="margin:10px 0">إضافة منتج جديد</h3>
<input id="pName" placeholder="اسم المنتج">
<input id="pCat" placeholder="الفئة (مثلا: سماعات)" value="إلكترونيات">
<input id="pPrice" type="number" placeholder="السعر">
<input id="pOld" type="number" placeholder="السعر القديم (اختياري)">
<input id="pDisc" placeholder="نسبة الخصم مثلا 20%">
<label style="font-size:12px">صورة المنتج:</label>
<input id="pImg" type="file" accept="image/*">
<div id="preview" style="margin:10px 0"></div>
<button onclick="addProduct()">➕ إضافة المنتج</button>

<script>
const LS_KEY='amtech_products_v4';
const PASS='ahmed123';
function login(){ if(document.getElementById('pass').value===PASS){ document.getElementById('loginBox').style.display='none'; document.getElementById('adminBox').style.display='block'; init(); } else alert('الباسورد غلط'); }
let products = JSON.parse(localStorage.getItem(LS_KEY)||'[]');
let tempImg='';

document.getElementById('pImg').addEventListener('change', e=>{
 const file=e.target.files[0]; if(!file)return;
 const reader=new FileReader(); reader.onload=ev=>{ tempImg=ev.target.result; document.getElementById('preview').innerHTML=`<img src="${tempImg}" style="width:80px;height:80px;border-radius:10px;object-fit:cover">`; }; reader.readAsDataURL(file);
});

function init(){
 document.getElementById('storeLink').innerText=location.href.replace('admin.html','index.html').replace('admin','index');
 renderList();
}
function addProduct(){
 const name=document.getElementById('pName').value;
 const cat=document.getElementById('pCat').value;
 const price=document.getElementById('pPrice').value;
 if(!name||!price) return alert('اكتب اسم وسعر');
 const prod={id:Date.now().toString(),name,cat,price,oldPrice:document.getElementById('pOld').value,disc:document.getElementById('pDisc').value,img:tempImg,icon:'📦'};
 products.push(prod); save(); renderList();
 document.getElementById('pName').value=''; document.getElementById('pPrice').value=''; document.getElementById('pOld').value=''; document.getElementById('pDisc').value=''; document.getElementById('preview').innerHTML=''; tempImg='';
 alert('تمت الإضافة');
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(products)); }
function renderList(){ const list=document.getElementById('list'); list.innerHTML=''; document.getElementById('count').innerText=products.length; products.forEach((p,i)=>{ list.innerHTML+=`<div class="prod"><div style="display:flex;gap:10px;align-items:center">${p.img?`<img src="${p.img}">`:'📦'}<div><div style="font-weight:700;font-size:13px">${p.name}</div><div style="font-size:11px;opacity:.6">${p.price} جنيه</div></div></div><b onclick="delProd(${i})" style="color:#ff3b30;cursor:pointer">✕</b></div>`; }); }
function delProd(i){ if(confirm('تمسح المنتج؟')){ products.splice(i,1); save(); renderList(); } }
function clearAll(){ if(confirm('متأكد تمسح كل المنتجات؟')){ products=[]; save(); renderList(); } }
function copyStore(){ navigator.clipboard.writeText(document.getElementById('storeLink').innerText); alert('تم نسخ لينك المتجر'); }
</script>
