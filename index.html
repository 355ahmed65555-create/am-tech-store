
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A.M Tech Store - أحمد • إكسسوارات أصلية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#f8f9fb}
header{background:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;box-shadow:0 1px 10px rgba(0,0,0,.05)}
.h-left{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:#f1f3f6;display:grid;place-items:center;font-size:18px;cursor:pointer;position:relative;border:none}
.icon-btn.cart{background:#0a7bff;color:#fff}
.cart-count{position:absolute;top:-4px;left:-4px;background:#ff3b30;color:#fff;font-size:10px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid #fff}
.h-right{display:flex;align-items:center;gap:10px}
.logo-box{background:#0a1628;color:#fff;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800}
.h-title{line-height:1.1}
.h-title b{font-size:15px}
.h-title span{font-size:11px;color:#666;display:block}
.search{margin:12px 15px;background:#fff;border-radius:30px;padding:10px 15px;display:flex;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.search input{border:none;outline:none;flex:1;background:transparent;font-size:13px}
.search span{color:#999}
.sec{padding:15px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sec-head h3{font-size:17px;font-weight:800}
.sec-head p{font-size:11px;color:#888}
.show-all{border:1px solid #e5e7eb;padding:6px 14px;border-radius:20px;font-size:12px;background:#fff;cursor:pointer;font-weight:600}
.cats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat-card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 15px rgba(0,0,0,.05);cursor:pointer;transition:.2s;border:1px solid #f0f0f0}
.cat-card:active{transform:scale(.97)}
.cat-icon{width:52px;height:52px;background:#eef4ff;border-radius:14px;display:grid;place-items:center;font-size:24px;color:#0a7bff;margin-bottom:30px}
.cat-card b{display:block;font-size:14px;margin-bottom:4px}
.cat-card span{font-size:11px;color:#888}
.products-view{display:none}
.back{margin-bottom:12px;display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.05)}
.p-img{height:135px;background:#f0f2f5;display:grid;place-items:center;font-size:40px;position:relative}
.p-off{position:absolute;top:7px;left:7px;background:#ff3b30;color:#fff;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700}
.p-body{padding:9px}
.p-cat{font-size:9px;color:#0a7bff;background:#eef4ff;display:inline-block;padding:2px 6px;border-radius:6px;margin-bottom:4px}
.p-name{font-size:12.5px;font-weight:700;height:36px;overflow:hidden;line-height:1.3}
.p-price{color:#0a7bff;font-weight:800;font-size:13px}
.p-old{font-size:10px;color:#999;text-decoration:line-through;margin-right:4px}
.p-actions{display:flex;gap:5px;margin-top:7px}
.p-actions button{flex:1;border:none;padding:6px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}
.add{background:#0a7bff;color:#fff}
.buy{background:#eef4ff;color:#0a7bff}
#cartPanel{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:99}
#cartPanel.open{display:block}
.cartBox{background:#fff;width:92%;max-width:380px;height:100%;margin-left:auto;padding:15px;overflow:auto;display:flex;flex-direction:column}
.cartItem{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.whatsFloat{position:fixed;bottom:20px;left:20px;background:#25D366;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer;z-index:25}
</style>
</head>
<body>
<header>
<div class="h-left">
<button class="icon-btn cart" onclick="openCart()">🛒 <span class="cart-count" id="cCount">0</span></button>
<button class="icon-btn">♡</button>
<button class="icon-btn">☾</button>
</div>
<div class="h-right">
<div class="h-title"><b>A.M Tech Store</b><span>أحمد • إكسسوارات أصلية</span></div>
<div class="logo-box">A.M</div>
</div>
</header>

<div class="search"><input id="searchInput" placeholder="ابحث عن منتج..." oninput="searchProd(this.value)"><span>🔍</span></div>

<div id="catsView" class="sec">
<div class="sec-head"><div><h3>تسوق حسب الفئة</h3><p>كل اللي محتاجه لموبايلك في مكان واحد</p></div><button class="show-all" onclick="showAllProducts()">عرض الكل</button></div>
<div class="cats-grid" id="catsGrid"></div>
</div>

<div id="productsView" class="sec products-view">
<div class="back" onclick="showCats()"><span>←</span> <span id="backTitle">رجوع للأقسام</span></div>
<div style="display:flex;justify-content:space-between;margin-bottom:10px"><b id="secTitle">كل المنتجات</b><span id="prodCount" style="color:#888;font-size:11px"></span></div>
<div id="productsGrid" class="grid"></div>
<div id="emptyProducts" style="text-align:center;padding:40px;color:#888;display:none">📦<br>مفيش منتجات هنا</div>
</div>

<div id="cartPanel" onclick="if(event.target==this)closeCart()"><div class="cartBox"><h3 style="margin-bottom:12px">سلة المشتريات <span onclick="closeCart()" style="float:left;cursor:pointer">✕</span></h3><div id="cartItems" style="flex:1"></div><div style="border-top:1px solid #eee;padding-top:12px"><div id="cartTotal" style="font-weight:800;margin-bottom:10px"></div><button onclick="orderWhats()" style="width:100%;background:#25D366;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:800;font-size:14px">إرسال الطلب واتساب 📲</button><div style="font-size:10px;color:#888;text-align:center;margin-top:8px">هيتبعت كل المنتجات اللي اخترتها بالتفصيل</div></div></div></div>

<div class="whatsFloat" onclick="openCart()">💬</div>

<script>
const LS_KEY='amtech_products_v4';
let products = JSON.parse(localStorage.getItem(LS_KEY)||'[]');
let cart = JSON.parse(localStorage.getItem('amtech_cart_v4')||'[]');
let currentCat='all';

const categories = [
{id:'شواحن وكابلات', name:'شواحن', icon:'⚡', count:'+85 منتج'},
{id:'ايربودز وسماعات', name:'سماعات', icon:'🎧', count:'+120 منتج'},
{id:'باور بانك', name:'باور بانك', icon:'🔋', count:'+60 منتج'},
{id:'جرابات وكفرات', name:'جرابات', icon:'📱', count:'+200 منتج'},
{id:'اسكرينات حماية', name:'كابلات', icon:'🔗', count:'+90 منتج'},
{id:'اسكرينات حماية', name:'ساعات ذكية', icon:'⌚', count:'+45 منتج', realId:'ساعات ذكية'},
{id:'اكسسوارات عامة', name:'إكسسوارات', icon:'📦', count:'+150 منتج'},
{id:'كيبورد وماوس', name:'كيبورد وماوس', icon:'⌨️', count:'+40 منتج'},
{id:'سماعات وهيدفون', name:'سماعات وهيدفون', icon:'🎧', count:'+70 منتج'},
{id:'ماوس باد', name:'ماوس باد', icon:'🖱️', count:'+30 منتج'},
];

const demo=[
{id:'1',name:'شاحن سريع 33W Type-C',cat:'شواحن وكابلات',price:'250',oldPrice:'350',disc:'28%',icon:'🔌',img:''},
{id:'2',name:'ايربودز برو 2 ANC',cat:'ايربودز وسماعات',price:'550',oldPrice:'750',disc:'26%',icon:'🎧',img:''},
{id:'3',name:'باور بانك 20000mAh PD',cat:'باور بانك',price:'600',oldPrice:'800',disc:'25%',icon:'🔋',img:''},
{id:'4',name:'جراب سيليكون أصلي',cat:'جرابات وكفرات',price:'90',oldPrice:'150',disc:'40%',icon:'📱',img:''},
{id:'5',name:'كابل شحن 3 في 1 قماش',cat:'شواحن وكابلات',price:'95',oldPrice:'',disc:'',icon:'🔗',img:''},
{id:'6',name:'ساعة T800 Ultra',cat:'ساعات ذكية',price:'750',oldPrice:'950',disc:'21%',icon:'⌚',img:''},
{id:'7',name:'كيبورد ميكانيكال RGB',cat:'كيبورد وماوس',price:'650',oldPrice:'',disc:'',icon:'⌨️',img:''},
{id:'8',name:'ماوس باد جيمينج كبير',cat:'ماوس باد',price:'150',oldPrice:'',disc:'',icon:'🖱️',img:''},
];
if(products.length===0){ products=demo; save(); }

function save(){ localStorage.setItem(LS_KEY, JSON.stringify(products)); }
function saveCart(){ localStorage.setItem('amtech_cart_v4', JSON.stringify(cart)); }

function renderCats(){
 const grid=document.getElementById('catsGrid');
 const counts={};
 products.forEach(p=>{ counts[p.cat]=(counts[p.cat]||0)+1; });
 // Use categories list but unique
 let uniqueCats=[
  {id:'شواحن وكابلات', name:'شواحن', icon:'⚡', countKey:'شواحن وكابلات'},
  {id:'ايربودز وسماعات', name:'سماعات', icon:'🎧', countKey:'ايربودز وسماعات'},
  {id:'باور بانك', name:'باور بانك', icon:'⚡', countKey:'باور بانك'},
  {id:'جرابات وكفرات', name:'جرابات', icon:'📱', countKey:'جرابات وكفرات'},
  {id:'اسكرينات حماية', name:'ساعات ذكية', icon:'⌚', countKey:'ساعات ذكية'},
  {id:'شواحن وكابلات', name:'كابلات', icon:'🔗', countKey:'شواحن وكابلات'},
  {id:'اكسسوارات', name:'إكسسوارات', icon:'📦', countKey:'all'},
 ];
 // Build from user requested 5 + 3 computer
 let finalCats=[
  {id:'شواحن وكابلات', name:'شواحن', icon:'⚡'},
  {id:'ايربودز وسماعات', name:'سماعات', icon:'🎧'},
  {id:'باور بانك', name:'باور بانك', icon:'🔋'},
  {id:'جرابات وكفرات', name:'جرابات', icon:'📱'},
  {id:'اسكرينات حماية', name:'ساعات ذكية', icon:'⌚'},
  {id:'شواحن وكابلات', name:'كابلات', icon:'🔗', realName:'كابلات'},
  {id:'all', name:'إكسسوارات', icon:'📦'},
  {id:'كيبورد وماوس', name:'كيبورد وماوس', icon:'⌨️'},
  {id:'سماعات وهيدفون', name:'سماعات وهيدفون', icon:'🎧'},
  {id:'ماوس باد', name:'ماوس باد', icon:'🖱️'},
 ];
 // Custom mapping to match image
 let catsForImage=[
  {id:'شواحن وكابلات', name:'شواحن', icon:'⚡', count:'85'},
  {id:'ايربودز وسماعات', name:'سماعات', icon:'🎧', count:'120'},
  {id:'باور بانك', name:'باور بانك', icon:'🔋', count:'60'},
  {id:'جرابات وكفرات', name:'جرابات', icon:'📱', count:'200'},
  {id:'اسكرينات حماية', name:'ساعات ذكية', icon:'⌚', count:'45'},
  {id:'شواحن وكابلات', name:'كابلات', icon:'🔗', count:'90', label:'كابلات'},
  {id:'all', name:'إكسسوارات', icon:'📦', count:'150'},
 ];

 grid.innerHTML='';
 catsForImage.forEach(c=>{
   let realCount = c.id==='all' ? products.length : products.filter(p=>p.cat===c.id || (c.id==='شواحن وكابلات' && c.label==='كابلات' && p.cat.includes('شواحن')) ).length;
   // for simplicity use product counts
   let displayCount = realCount>0 ? realCount : c.count;
   grid.innerHTML+=`<div class="cat-card" onclick="openCategory('${c.id}','${c.label||c.name}')"><div class="cat-icon">${c.icon}</div><b>${c.label||c.name}</b><span>${displayCount} منتج</span></div>`;
 });
}

function openCategory(catId, catName){
 currentCat=catId;
 document.getElementById('catsView').style.display='none';
 document.getElementById('productsView').style.display='block';
 document.getElementById('backTitle').innerText=catName;
 document.getElementById('secTitle').innerText=catName;
 renderProducts();
 window.scrollTo(0,0);
}
function showCats(){
 document.getElementById('catsView').style.display='block';
 document.getElementById('productsView').style.display='none';
}
function showAllProducts(){
 openCategory('all','كل المنتجات');
}

function renderProducts(){
 const grid=document.getElementById('productsGrid');
 const empty=document.getElementById('emptyProducts');
 let filtered = currentCat==='all' ? products : products.filter(p=>p.cat===currentCat || (currentCat==='شواحن وكابلات' && p.cat.includes('شواحن')));
 grid.innerHTML='';
 if(filtered.length===0){ empty.style.display='block'; document.getElementById('prodCount').innerText='0 منتج'; }
 else{
  empty.style.display='none';
  document.getElementById('prodCount').innerText=filtered.length+' منتج';
  filtered.forEach(p=>{
   grid.innerHTML+=`<div class="p-card"><div class="p-img">${p.img?`<img src="${p.img}" style="width:100%;height:100%;object-fit:cover">`:p.icon}${p.disc?`<div class="p-off">-${p.disc}</div>`:''}</div><div class="p-body"><div class="p-cat">${p.cat}</div><div class="p-name">${p.name}</div><div><span class="p-price">${p.price} جنيه</span>${p.oldPrice?`<span class="p-old">${p.oldPrice}</span>`:''}</div><div class="p-actions"><button class="add" onclick="addCart('${p.id}')">أضف +</button><button class="buy" onclick="buyNow('${p.id}')">شراء</button></div></div></div>`;
  });
 }
 document.getElementById('cCount').innerText=cart.length;
}
function searchProd(q){
 if(!q){ showCats(); return; }
 currentCat='all';
 document.getElementById('catsView').style.display='none';
 document.getElementById('productsView').style.display='block';
 document.getElementById('secTitle').innerText='نتائج البحث';
 let filtered=products.filter(p=>p.name.includes(q));
 const grid=document.getElementById('productsGrid');
 grid.innerHTML='';
 filtered.forEach(p=>{
  grid.innerHTML+=`<div class="p-card"><div class="p-img">${p.icon}</div><div class="p-body"><div class="p-name">${p.name}</div><div class="p-price">${p.price} جنيه</div><button class="add" style="width:100%;margin-top:6px" onclick="addCart('${p.id}')">أضف +</button></div></div>`;
 });
}

function addCart(id){ let item=products.find(x=>x.id==id); cart.push(item); saveCart(); renderProducts(); }
function buyNow(id){ addCart(id); openCart(); }
function openCart(){ document.getElementById('cartPanel').classList.add('open'); renderCart(); }
function closeCart(){ document.getElementById('cartPanel').classList.remove('open'); }
function renderCart(){
 let div=document.getElementById('cartItems'); div.innerHTML='';
 let total=0;
 if(cart.length===0){ div.innerHTML='<div style="text-align:center;padding:30px;color:#888">السلة فاضية</div>'; }
 cart.forEach((c,i)=>{
  total+=parseInt(c.price||0);
  div.innerHTML+=`<div class="cartItem"><div><b>${c.name}</b><br><small style="color:#888">${c.cat} - ${c.price} جنيه</small></div><span style="color:#ff3b30;cursor:pointer" onclick="removeCart(${i})">✕</span></div>`;
 });
 document.getElementById('cartTotal').innerText='الإجمالي: '+total+' جنيه - عدد المنتجات: '+cart.length;
}
function removeCart(i){ cart.splice(i,1); saveCart(); renderCart(); renderProducts(); }

function orderWhats(){
 if(cart.length===0) return alert('السلة فاضية');
 let total=0;
 let msgLines=[];
 msgLines.push('السلام عليكم A.M Tech Store');
 msgLines.push('');
 msgLines.push('📦 طلب جديد');
 msgLines.push('');
 cart.forEach((c,i)=>{
  total+=parseInt(c.price||0);
  msgLines.push(`${i+1}. ${c.name}`);
  msgLines.push(`   الفئة: ${c.cat}`);
  msgLines.push(`   السعر: ${c.price} جنيه`);
  msgLines.push('');
 });
 msgLines.push('----------------');
 msgLines.push(`💰 الإجمالي: ${total} جنيه`);
 msgLines.push(`📦 عدد المنتجات: ${cart.length}`);
 msgLines.push('');
 msgLines.push('ممكن تأكيد الطلب؟');
 let msg = encodeURIComponent(msgLines.join('\n'));
 // نستخدم api.whatsapp.com لأنه يشتغل جوه معاينة tiiny بدون ERR_UNKNOWN_URL_SCHEME
 let url = 'https://api.whatsapp.com/send?phone=201096514020&text=' + msg;
 window.location.href = url;
}

renderCats();
renderProducts();
</script>
</body>
</html>
