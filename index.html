<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A.Mega Store 👑 أسطوري - النسخة النهائية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--gold:#d4af37;--gold2:#ffd700;--black:#080808;--card:#151515;--border:#2a2a2a;--green:#22c55e}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--black);color:#fff;overflow-x:hidden}
.delivery-bar{background:linear-gradient(90deg,#000,#1a1a1a);border-bottom:1px solid var(--gold);color:var(--gold2);text-align:center;padding:8px;font-weight:800;font-size:12px;position:sticky;top:0;z-index:35}
header{background:#000;border-bottom:2px solid var(--gold);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:32px;z-index:30}
.logo{font-weight:900;color:var(--gold);display:flex;gap:8px;align-items:center}.logo b{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;padding:5px 10px;border-radius:8px;font-size:12px}
.icon-btn{width:40px;height:40px;background:var(--card);border:1px solid var(--border);border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--gold);position:relative;font-size:16px}
.icon-btn .badge{position:absolute;top:-6px;right:-6px;background:#ff0000;color:#fff;width:18px;height:18px;border-radius:50%;font-size:10px;display:grid;place-items:center}
.lang-bar{display:flex;gap:6px;padding:8px 12px;background:#000;border-bottom:1px solid var(--border)}
.lang-btn{flex:1;padding:8px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:#aaa;font-weight:800;cursor:pointer;font-size:11px}
.lang-btn.active{background:var(--gold);color:#000}
.cat-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#000;border-bottom:1px solid var(--border)}
.cat-chip{white-space:nowrap;background:var(--card);border:1px solid var(--border);color:#aaa;padding:7px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer}
.cat-chip.active{background:var(--gold);color:#000}
.sec{padding:12px}
.searchBox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px;display:flex;gap:8px}
.searchBox input{flex:1;background:#000;border:1px solid var(--border);border-radius:10px;padding:11px;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;position:relative}
.p-img{height:130px;background:#000;display:flex;align-items:center;justify-content:center;position:relative}
.p-img img{width:100%;height:100%;object-fit:contain;padding:8px}
.badge{position:absolute;font-size:9px;font-weight:900;padding:3px 6px;border-radius:6px}
.badge-disc{top:6px;left:6px;background:#ff0000;color:#fff}
.badge-wholesale{bottom:6px;left:6px;background:var(--gold);color:#000;font-size:8px}
.p-body{padding:10px}
.p-name{font-size:12px;font-weight:700;min-height:32px;color:#fff}
.price-row{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:4px 0}
.old{color:#666;text-decoration:line-through;font-size:11px}
.new{color:var(--gold2);font-weight:900;font-size:14px}
.merchant-price{color:var(--green);font-size:11px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);padding:2px 6px;border-radius:6px}
.p-actions{display:flex;gap:6px;margin-top:8px;padding:0 10px 10px}
.p-actions button{flex:1;border:none;padding:8px;border-radius:9px;font-size:11px;font-weight:800;cursor:pointer}
.add{background:#000;color:var(--gold);border:1px solid var(--gold)}
.buy{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000}
#cartPanel{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;z-index:99;place-items:center}
#cartPanel.open{display:grid}
.box{background:var(--card);border:1px solid var(--gold);width:94%;max-width:480px;max-height:94vh;border-radius:18px;padding:16px;overflow:auto;color:#fff;position:relative}
#toastContainer{position:fixed;top:40px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:8px;width:92%;max-width:360px;pointer-events:none}
.toast{padding:12px 16px;border-radius:12px;font-size:13px;font-weight:700;text-align:center;border:1px solid}
.toast.success{background:#111;border-color:var(--gold);color:var(--gold)}.toast.error{background:#2a0a0a;border-color:#ff4444;color:#ff8888}
#loginOverlay{position:fixed;inset:0;background:#000;z-index:10000;display:grid;place-items:center;padding:14px}
.loginBox{background:var(--card);border:2px solid var(--gold);width:100%;max-width:420px;border-radius:20px;padding:22px}
.tabsAuth{display:flex;background:#000;border-radius:12px;padding:4px;margin:12px 0;border:1px solid var(--border)}
.tabAuth{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;font-weight:800;font-size:13px;color:#777}.tabAuth.active{background:var(--gold);color:#000}
.authInput{width:100%;padding:12px;background:#000;border:1px solid var(--border);border-radius:10px;margin:5px 0;font-size:13px;color:#fff}
.authBtn{width:100%;padding:13px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border:none;border-radius:12px;font-weight:900;margin-top:10px;cursor:pointer}
#sideMenu{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:50}#sideMenu.open{display:block}
.menuContent{background:var(--card);border-right:2px solid var(--gold);width:86%;max-width:340px;height:100%;overflow:auto;display:flex;flex-direction:column}
.menuHeader{background:#000;color:var(--gold);padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--gold)}
.menuItem{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;cursor:pointer;font-size:13px;color:#ccc}
#otpBox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;display:none;place-items:center;padding:14px}#otpBox.open{display:grid}
.pay-option{display:flex;gap:10px;align-items:center;background:#000;border:1px solid var(--border);border-radius:10px;padding:10px;margin:6px 0;cursor:pointer}
.pay-option.active{border-color:var(--gold);background:rgba(212,175,55,.1)}

function calcSale(r,d){return Math.round(r*(1-(d||0)/100));}
let cart=JSON.parse(localStorage.getItem(LS_CART)||'[]');let currentUser=JSON.parse(localStorage.getItem(LS_CURRENT)||'null');let pendingUser=null,currentOTP=null,currentCat='الكل',selectedPay='cod',userType=localStorage.getItem(LS_TYPE)||'normal';
function playTick(){try{const a=document.getElementById("tickSound");a.currentTime=0;a.volume=0.5;a.play().catch(()=>{});}catch(e){}} function showToast(m,t='success'){const c=document.getElementById('toastContainer');const d=document.createElement('div');d.className='toast '+t;d.innerText=m;c.appendChild(d);setTimeout(()=>d.remove(),3500);}
function isValidPhone(ph){return /^01[0125][0-9]{8}$/.test(ph);}
function saveCart(){localStorage.setItem(LS_CART, JSON.stringify(cart));const el=document.getElementById('cartCount'); if(el) el.innerText=cart.length;}
function openMenu(){document.getElementById('sideMenu').classList.add('open');if(currentUser){document.getElementById('menuUserName').innerText=currentUser.name;document.getElementById('menuUserPhone').innerText=currentUser.phone;document.getElementById('menuUserType').innerText=userType=='trader'?'👑 تاجر جملة':'زبون عادي';}}
function closeMenu(){document.getElementById('sideMenu').classList.remove('open');}
function startDeliveryTimer(){let sec=2*3600+14*60+30;setInterval(()=>{sec--;if(sec<0) sec=2*3600;const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;const el=document.getElementById('deliveryTimer');if(el) el.innerText=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;},1000);}
function renderCats(){const bar=document.getElementById('catBar');if(!bar) return;bar.innerHTML='<div class="cat-chip '+(currentCat=='الكل'?'active':'')+'" onclick="filterCat(\'الكل\')">الكل</div>';cats.forEach(c=>{bar.innerHTML+=`<div class="cat-chip ${currentCat==c?'active':''}" onclick="filterCat('${c}')">${c}</div>`;});}
function filterCat(c){currentCat=c;renderCats();renderProducts();}
function setupShipping(){const sel=document.getElementById('shipGov');if(!sel) return;sel.innerHTML='<option value="">اختار المحافظة</option>';GOVS.forEach(g=>{sel.innerHTML+=`<option value="${g}">${g} - ${shipCosts[g]}ج</option>`;});}
function renderPayMethods(){const div=document.getElementById('payMethodsList');if(!div) return;div.innerHTML='<b style="color:var(--gold);font-size:13px">💳 اختار طريقة الدفع:</b>';payMethods.forEach(p=>{div.innerHTML+=`<div class="pay-option ${selectedPay==p.id?'active':''}" onclick="selectPay('${p.id}')"><span>${p.icon}</span><div><b>${p.name}</b><br><small style="color:#888">${p.details}</small></div></div>`;});}
function selectPay(id){selectedPay=id;renderPayMethods();}
function setUserType(t){
userType=t;localStorage.setItem(LS_TYPE,t);
document.querySelectorAll('#typeNormal,#typeTrader,#regTypeNormal,#regTypeTrader').forEach(el=>el.classList.remove('active'));
if(t=='normal'){document.getElementById('typeNormal')?.classList.add('active');document.getElementById('regTypeNormal')?.classList.add('active');}
else{document.getElementById('typeTrader')?.classList.add('active');document.getElementById('regTypeTrader')?.classList.add('active');}
renderProducts();showToast(t=='trader'?'👑 وضع التاجر - أقل طلب 5 قطع':'وضع زبون عادي');
}
function switchAuth(t){
document.getElementById('tabLogin').classList.toggle('active',t=='login');
document.getElementById('tabRegister').classList.toggle('active',t=='register');
document.getElementById('loginForm').style.display=t=='login'?'block':'none';
document.getElementById('registerForm').style.display=t=='register'?'block':'none';
}
function convertPrice(p){return p+'ج';}
function renderProducts(){
const g=document.getElementById('productsGrid');if(!g) return;let arr=currentCat=='الكل'?products:products.filter(x=>x.cat==currentCat);g.innerHTML='';
arr.forEach(p=>{
let sale=calcSale(p.retail,p.discount||0);
let displayPrice=userType=='trader'?(p.traderPrice||p.wholesale):sale;
g.innerHTML+=`<div class="p-card"><div class="p-img"><img src="${p.img}"><span class="badge badge-disc">${p.discount?'-'+p.discount+'%':''}</span>${userType=='trader'?'<span class="badge badge-wholesale">جملة</span>':''}</div><div class="p-body"><div class="p-name">${p.name}</div><div class="price-row"><span class="new">${convertPrice(displayPrice)}</span></div></div><div class="p-actions"><button class="add" onclick="addToCart('${p.id}')">+ سلة</button><button class="buy" onclick="buyNow('${p.id}')">شراء</button></div></div>`;
});
}
function addToCart(id){playTick();
const p=products.find(x=>x.id==id);if(!p)return;
let price=calcSale(p.retail,p.discount||0);if(userType=='trader') price=p.traderPrice||p.wholesale;
cart.push({...p,salePrice:price});
saveCart();renderCart();showToast('✅ اتضاف للسلة');
}
function buyNow(id){playTick();addToCart(id);openCart();}
function openCart(){playTick();document.getElementById('cartPanel').classList.add('open');if(currentUser){document.getElementById('custName').value=currentUser.name;document.getElementById('orderPhone1').value=currentUser.phone;}renderCart();}
function closeCart(){playTick();document.getElementById('cartPanel').classList.remove('open');}
function renderCart(){
let div=document.getElementById('cartItems');if(!div) return;div.innerHTML='';let subtotal=0;
cart.forEach((c,i)=>{subtotal+=c.salePrice;div.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222"><span style="font-size:12px">${c.name}</span><span>${convertPrice(c.salePrice)} <b onclick="removeCart(${i})" style="color:#f44;cursor:pointer">✕</b></span></div>`;});
const gov=document.getElementById('shipGov').value;let ship=gov?shipCosts[gov]:0;let total=subtotal+ship;
const totalEl=document.getElementById('cartTotal');if(totalEl){totalEl.innerHTML=`مجموع: ${convertPrice(subtotal)} + شحن ${convertPrice(ship)} = <b>${convertPrice(total)}</b>`;totalEl.dataset.total=total;}
}
function removeCart(i){cart.splice(i,1);saveCart();renderCart();}
function doLogin(){
const phone=document.getElementById('loginPhone').value.trim();
const pass=document.getElementById('loginPass').value;
if(!isValidPhone(phone)){showToast('❌ لازم 11 رقم','error');return;}
let users=JSON.parse(localStorage.getItem(LS_USERS)||'[]');let u=users.find(x=>x.phone==phone && x.pass==pass);if(!u){showToast('رقم أو باسورد غلط','error');return;}
currentUser=u;localStorage.setItem(LS_CURRENT, JSON.stringify(u));localStorage.setItem(LS_TYPE, userType);checkLogin();showToast('✅ أهلا '+u.name);
}
function doRegister(){
const name=document.getElementById('regName').value.trim();
let phone=document.getElementById('regPhone').value.trim();
const pass=document.getElementById('regPass').value;
const pass2=document.getElementById('regPass2').value;
if(!name){showToast('اكتب اسمك','error');return;}
if(!isValidPhone(phone)){showToast('❌ لازم 11 رقم','error');return;}
if(pass.length<4){showToast('باسورد قصير','error');return;}
if(pass!==pass2){showToast('تأكيد كلمة المرور غلط','error');return;}
let users=JSON.parse(localStorage.getItem(LS_USERS)||'[]');if(users.find(x=>x.phone==phone)){showToast('الرقم متسجل قبل كده','error');return;}
currentOTP=Math.floor(100000+Math.random()*900000).toString();
pendingUser={name,phone,pass,address:'',referralCode:'MEGA-'+Math.random().toString(36).substring(2,6).toUpperCase(),username:phone,type:userType};
document.getElementById('otpPhoneDisplay').innerText=phone;document.getElementById('otpCodeDisplay').innerText=currentOTP;document.getElementById('otpWaLink').href='https://wa.me/2'+phone+'?text=كود التحقق: '+currentOTP;document.getElementById('otpBox').classList.add('open');
}
function verifyOTP(){
const inp=document.getElementById('otpInput').value.trim();
if(!inp || inp.length!=6){showToast('اكتب 6 أرقام','error');return;}
if(inp!=currentOTP){showToast('❌ كود غلط - الصح '+currentOTP,'error');return;}
let users=JSON.parse(localStorage.getItem(LS_USERS)||'[]');
if(users.find(x=>x.phone==pendingUser.phone)){showToast('متسجل قبل كده','error');document.getElementById('otpBox').classList.remove('open');return;}
users.push(pendingUser);localStorage.setItem(LS_USERS, JSON.stringify(users));
currentUser=pendingUser;localStorage.setItem(LS_CURRENT, JSON.stringify(currentUser));localStorage.setItem(LS_TYPE, userType);
document.getElementById('otpBox').classList.remove('open');
document.getElementById('otpInput').value='';pendingUser=null;currentOTP=null;
checkLogin();showToast('✅ تم التحقق - أهلا '+currentUser.name);
}
function checkLogin(){
const overlay=document.getElementById('loginOverlay');
if(currentUser){overlay.style.display='none';renderCats();renderProducts();setupShipping();renderPayMethods();saveCart();}
else{overlay.style.display='grid';}
}
function placeOrder(){
if(cart.length==0){showToast('السلة فاضية','error');return;}
const custName=document.getElementById('custName').value.trim();
const ph1=document.getElementById('orderPhone1').value.trim();
const ph2=document.getElementById('orderPhone2').value.trim();
const gov=document.getElementById('shipGov').value;
const addr=document.getElementById('custAddress').value.trim();
const totalEl=document.getElementById('cartTotal');const total=parseInt(totalEl.dataset.total||0);
if(!custName){showToast('اسم المستلم','error');return;}
if(!isValidPhone(ph1)){showToast('رقم1 11 رقم','error');return;}
if(!isValidPhone(ph2)){showToast('رقم2 مختلف','error');return;}
if(ph1===ph2){showToast('نفس الرقم','error');return;}
if(!gov){showToast('اختار محافظة','error');return;}
if(!addr){showToast('عنوان','error');return;}
if(userType=='trader'){
let counts={};cart.forEach(c=>{counts[c.id]=(counts[c.id]||0)+1;});
for(let pid in counts){if(counts[pid]<5){showToast('👑 تاجر: أقل طلب 5 قطع','error');return;}}
}
let orders=JSON.parse(localStorage.getItem(LS_ORDERS)||'[]');
const order={id:Date.now().toString(),customer:{name:custName,phone:ph1,phone2:ph2,address:gov+' - '+addr,gov,type:userType},products:[...cart],total,date:new Date().toLocaleString('ar-EG'),status:'في انتظار تأكيد الطلب'};
orders.unshift(order);localStorage.setItem(LS_ORDERS,JSON.stringify(orders));
document.getElementById('successMsg').innerText='شكرا يا '+custName;
document.getElementById('successDetails').innerHTML=`طلب #${order.id.slice(-6)}<br>💰 ${convertPrice(total)}`;
document.getElementById('orderSuccess').style.display='grid';
cart=[];saveCart();closeCart();showToast('✅ تم الطلب');
}
function openMyOrders(){const list=document.getElementById('myOrdersList');let myOrders=JSON.parse(localStorage.getItem(LS_ORDERS)||'[]');if(myOrders.length==0){list.innerHTML='مفيش طلبات';}else{list.innerHTML='';myOrders.forEach(o=>{list.innerHTML+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin:8px 0"><b>#${o.id.slice(-6)}</b> - ${o.status}<br>💰 ${convertPrice(o.total)}</div>`;});}document.getElementById('myOrdersPanel').style.display='block';}
function logout(){localStorage.removeItem(LS_CURRENT);location.reload();}
function doSearch(){const q=document.getElementById('searchInput').value.trim().toLowerCase();if(!q)return;const res=products.filter(p=>p.name.toLowerCase().includes(q));const g=document.getElementById('productsGrid');g.innerHTML='';res.forEach(p=>{g.innerHTML+=`<div class="p-card"><div class="p-img"><img src="${p.img}"></div><div class="p-body"><div class="p-name">${p.name}</div></div></div>`;});}
startDeliveryTimer();checkLogin();
</script>
</body></html>
